# ==============================================================================
# WORKFLOW: Release Ontology
# ==============================================================================
# Purpose: Stamp release version into artifacts, create a GitHub release with
#          attached serialization artifacts, and trigger documentation rebuild.
#
# ┌─────────────────────────────────────────────────────────────────────┐
# │  What this workflow does                                            │
# │  ─────────────────────────────────────────────────────────────────  │
# │  1. Validates semver tag format (replaces enforce-tags.yml)        │
# │  2. Rebuilds through ODK and stamps version metadata into         │
# │     OWL, Turtle, and JSON artifacts                               │
# │       versionIRI: <ontbase>/<version>/  (PMD convention)         │
# │       e.g.  https://w3id.org/pmd/matsus/1.0.0/                   │
# │  3. Commits stamped artifacts back to main                         │
# │  4. Creates a git tag v<version> pointing to that commit           │
# │  5. Creates a GitHub release with OWL / TTL / JSON attached        │
# │  6. Dispatches trigger-docs so docs.yml rebuilds versioned docs    │
# └─────────────────────────────────────────────────────────────────────┘
#
# Triggers:
#   Manual only — Actions → Release Ontology → Run workflow → enter version
#
# Version format: semver without the "v" prefix (e.g. 1.0.0, 2.1.3)
#
# Execution chain:
#   [this] → docs (versioned Widoco build + GitHub Pages deploy)
# ==============================================================================

name: Release Ontology

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version — semver X.Y.Z without v prefix (e.g. 1.0.0). Becomes owl:versionIRI ontbase/1.0.0.
        required: true
        type: string
      release_notes:
        description: Release notes (markdown). Leave empty to auto-generate from commits.
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    container: obolibrary/odkfull:v1.6

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check ontology scaffold exists
        run: |
          if [ ! -d "src/ontology" ] || [ ! -f "src/ontology/Makefile" ]; then
            echo "::error::src/ontology not found. Run the Setup New Ontology workflow first."
            exit 1
          fi

      # ── Validate and resolve version ─────────────────────────────────────
      - name: Resolve version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "::error::Version '$VERSION' is not valid semver (expected X.Y.Z)"
            exit 1
          }
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing version: $VERSION"

      # ── Guard: fail early if release already exists ───────────────────────
      - name: Check release does not already exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            echo "::error::Release v${VERSION} already exists. Delete it and the tag first."
            exit 1
          fi

      # ── Stamp versionIRI into all release artifacts ───────────────────────
      # Rebuild first so release artifacts are derived from the authoritative
      # editor source and imports, then stamp the requested semver version.
      # ──────────────────────────────────────────────────────────────────────
      - name: Build and synchronize release artifacts
        env:
          ROBOT_ENV: ROBOT_JAVA_ARGS=-Xmx6G
        run: |
          cd src/ontology
          make refresh-imports all_assets
          make copy_release_files

      - name: Stamp version into artifacts
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ODK_YAML=$(find src/ontology -maxdepth 1 -name "*-odk.yaml" | head -1)
          ONT_ID=$(python3 -c "import yaml; d=yaml.safe_load(open('$ODK_YAML')); print(d['id'])")
          URIBASE=$(python3 -c "import yaml; d=yaml.safe_load(open('$ODK_YAML')); print(d['uribase'])")
          ONTBASE="${URIBASE}/${ONT_ID}"
          for f in $(find src/ontology -maxdepth 1 -name "*.owl" \
                     ! -name "*-edit.owl" ! -name "*-idranges.owl"); do
            robot annotate \
              --input "$f" \
              --version-iri "${ONTBASE}/${VERSION}/" \
              --annotation owl:versionInfo "${VERSION}" \
              --output "$f"
            TTL="${f%.owl}.ttl"
            [ -f "$TTL" ] && robot annotate \
              --input "$TTL" \
              --version-iri "${ONTBASE}/${VERSION}/" \
              --annotation owl:versionInfo "${VERSION}" \
              --output "$TTL"
            JSON="${f%.owl}.json"
            [ -f "$JSON" ] && robot convert \
              --input "$f" \
              --check false \
              --format json \
              --output "$JSON"
          done
          cd src/ontology
          make copy_release_files

      # ── Commit stamped artifacts ──────────────────────────────────────────
      - name: Commit release artifacts
        uses: EndBug/add-and-commit@v9
        with:
          message: Release v${{ steps.version.outputs.version }}
          cwd: .
          add: matsus.owl matsus.ttl matsus.json src/ontology/matsus.ttl src/ontology/imports/*.owl
          default_author: github_actions
          push: true

      # ── Create git tag ────────────────────────────────────────────────────
      - name: Create git tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag "v${VERSION}" 2>/dev/null && git push origin "v${VERSION}" || \
            echo "Tag v${VERSION} already exists — skipping."

      # ── Create GitHub release ─────────────────────────────────────────────
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES="${{ inputs.release_notes }}"

          ASSETS=$(find src/ontology -maxdepth 1 \( -name "*.owl" -o -name "*.ttl" -o -name "*.json" \) \
                   ! -name "*-edit.owl" | tr '\n' ' ')

          if [ -z "$ASSETS" ]; then
            echo "::error::No release artifacts found in src/ontology/"
            exit 1
          fi

          echo "Attaching assets: $ASSETS"

          if [ -n "$NOTES" ]; then
            gh release create "v${VERSION}" \
              --title "Release v${VERSION}" \
              --notes "$NOTES" \
              --generate-notes \
              $ASSETS
          else
            gh release create "v${VERSION}" \
              --title "Release v${VERSION}" \
              --generate-notes \
              $ASSETS
          fi

      # ── Trigger versioned documentation build ────────────────────────────
      - name: Trigger versioned documentation build
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: trigger-docs
          client-payload: '{"version": "${{ steps.version.outputs.version }}"}'
