<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="455" viewBox="0 0 1200 455" role="img">
<title>PMDco building block · measurement datum</title><desc>Upstream measurement-datum pattern; assess compatibility before copying into P2</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1e293b} .title{font-size:27px;font-weight:700}.subtitle{font-size:16px;fill:#475569}.head{font-size:19px;font-weight:700}.small{font-size:15px;fill:#334155}.fine{font-size:14px;fill:#64748b}.pmdbox{fill:#e0f2fe;stroke:#0284c7;stroke-width:2}.matbox{fill:#f3e8ff;stroke:#870cfb;stroke-width:2}.process{fill:#fff3cf;stroke:#d97706;stroke-width:2}.note{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5}.edge{stroke:#475569;stroke-width:2.3;fill:none;marker-end:url(#arr)}.dashed{stroke-dasharray:8 6}.legend{font-size:13px;fill:#64748b}</style>
<defs><marker id="arr" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto"><polygon points="0,0 11,4 0,8" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text class="title" x="32" y="47">PMDco building block · measurement datum</text>
<text class="subtitle" x="32" y="78">Upstream closed shape; assess compatibility before copying into P2</text>
<rect x="45" y="145" rx="12" width="246" height="110" class="process"/>
<text x="168.0" y="194.5" text-anchor="middle" font-size="16" font-weight="700">Assay / computation</text>
<text x="168.0" y="217.5" text-anchor="middle" font-size="16" font-weight="400">generating activity</text>
<rect x="465" y="145" rx="12" width="255" height="110" class="matbox"/>
<text x="592.5" y="194.5" text-anchor="middle" font-size="16" font-weight="700">Measurement datum</text>
<text x="592.5" y="217.5" text-anchor="middle" font-size="16" font-weight="400">IAO_0000109</text>
<rect x="875" y="145" rx="12" width="270" height="110" class="matbox"/>
<text x="1010.0" y="194.5" text-anchor="middle" font-size="16" font-weight="700">Value specification</text>
<text x="1010.0" y="217.5" text-anchor="middle" font-size="16" font-weight="400">numeric value + unit</text>
<path d="M 291 200 L 465 200" class="edge"/>
<text x="378.0" y="191" text-anchor="middle" class="fine">specified output</text>
<path d="M 720 200 L 875 200" class="edge"/>
<text x="797.5" y="191" text-anchor="middle" class="fine">OBI_0001938</text>
<rect x="465" y="313" rx="12" width="255" height="72" class="pmdbox"/>
<text x="592.5" y="343.5" text-anchor="middle" font-size="16" font-weight="700">Measured quality</text>
<text x="592.5" y="366.5" text-anchor="middle" font-size="16" font-weight="400">BFO_0000019</text>
<path d="M 590 255 L 590 313" class="edge dashed"/>
<text x="735" y="292" text-anchor="middle" class="fine">is quality measurement of (optional; alignment checked)</text>
<text class="fine" x="32" y="430">P2 lacks the required generating-activity link; its labels and source links also violate the upstream closed shape.</text>
</svg>
