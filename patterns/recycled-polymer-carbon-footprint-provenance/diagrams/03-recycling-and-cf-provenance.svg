<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1130" viewBox="0 0 1600 1130" role="img" aria-labelledby="t d">
<title id="t">Recycled high-density polyethylene (HDPE): physical genealogy and carbon-footprint provenance</title><desc id="d">Three sections show six recycling subprocesses and bottle production; a sorting carbon-footprint evidence example; and the provenance of the final bottle carbon-footprint result. Orange denotes processes, blue material entities and equipment, violet information entities. All values are illustrative.</desc>
