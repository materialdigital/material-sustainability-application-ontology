<text class="subtitle" x="32" y="78">Composition and temporal relations are distinct assertions</text>
<rect x="50" y="112" rx="12" width="1100" height="200" class="note"/>
<text x="600.0" y="218.0" text-anchor="middle" font-size="19" font-weight="700"></text>
<rect x="95" y="181" rx="12" width="245" height="86" class="process"/>
<text x="217.5" y="218.5" text-anchor="middle" font-size="16" font-weight="700">Stage A</text>
<text x="217.5" y="241.5" text-anchor="middle" font-size="16" font-weight="400">process occurrence</text>
<rect x="475" y="181" rx="12" width="245" height="86" class="process"/>
<text x="597.5" y="218.5" text-anchor="middle" font-size="16" font-weight="700">Stage B</text>
<text x="597.5" y="241.5" text-anchor="middle" font-size="16" font-weight="400">process occurrence</text>
<rect x="855" y="181" rx="12" width="245" height="86" class="process"/>
<text x="977.5" y="218.5" text-anchor="middle" font-size="16" font-weight="700">Stage C</text>
<text x="977.5" y="241.5" text-anchor="middle" font-size="16" font-weight="400">process occurrence</text>
