<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Inventory and carbon-footprint result provenance</title><desc id="desc">Physical processes have source records and inventory data compiled by LCI analysis, then used with specifications and an emission factor by black-box CF quantification.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#334155"/></marker><style>
    text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:26px;font-weight:700}.sub{font-size:14px;fill:#475569}.head{font-size:16px;font-weight:700}.small{font-size:12px}.phys{fill:#e0f2fe;stroke:#0284c7;stroke-width:2}.info{fill:#f3e8ff;stroke:#9333ea;stroke-width:2}.act{fill:#fef3c7;stroke:#d97706;stroke-width:2}.res{fill:#dcfce7;stroke:#16a34a;stroke-width:2}.warn{fill:#fee2e2;stroke:#dc2626;stroke-width:2}.edge{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#a)}.dash{stroke-dasharray:7 5}
  </style></defs>
  <rect width="1440" height="820" fill="#f8fafc"/><text x="40" y="45" class="title">Inventory, CF quantification and result provenance</text>
  <text x="40" y="72" class="sub">Solid arrows summarize asserted RDF paths. Calculations stay black-box; contributes-to is qualitative, not arithmetic.</text>

  <text x="45" y="120" class="head">Physical layer</text>
  <rect x="45" y="145" width="215" height="70" rx="10" class="phys"/><text x="76" y="174" class="head">Washing occurrence</text><text x="77" y="194" class="small">flakes + water + detergent</text><text x="77" y="208" class="small">to flakes + wastewater</text>
  <rect x="320" y="145" width="195" height="70" rx="10" class="phys"/><text x="355" y="174" class="head">Other 5 subprocesses</text><text x="350" y="197" class="small">each has physical input/output</text>
  <rect x="1110" y="145" width="250" height="70" rx="10" class="phys"/><text x="1148" y="174" class="head">Bottle production</text><text x="1134" y="197" class="small">300 kg recycled + 700 kg virgin</text>

  <text x="45" y="275" class="head">Evidence layer</text>
  <rect x="45" y="300" width="215" height="92" rx="10" class="info"/><text x="73" y="327" class="head">Washing inventory</text><text x="64" y="350" class="small">18 kWh · 450 L water</text><text x="64" y="370" class="small">1.5 kg detergent · 430 L wastewater</text>
  <rect x="320" y="300" width="195" height="92" rx="10" class="info"/><text x="347" y="327" class="head">Other inventories</text><text x="342" y="350" class="small">electricity datum + value</text><text x="347" y="370" class="small">+ named source record</text>
  <rect x="575" y="300" width="210" height="92" rx="10" class="info"/><text x="615" y="327" class="head">Specifications</text><text x="596" y="350" class="small">functional unit · reference flow</text><text x="610" y="370" class="small">system boundary · model</text>
  <rect x="845" y="300" width="205" height="92" rx="10" class="info"/><text x="870" y="327" class="head">Synthetic factor</text><text x="873" y="350" class="small">0.4 kg CO2e/kWh</text><text x="873" y="370" class="small">named synthetic source</text>
  <rect x="1110" y="300" width="250" height="92" rx="10" class="info"/><text x="1142" y="327" class="head">Supplier declaration</text><text x="1130" y="350" class="small">result ≠ declaration document</text><text x="1140" y="370" class="small">primary model not exposed</text>
  <path d="M150 215V300M415 215V300" class="edge"/>

  <text x="45" y="455" class="head">Compilation and computation activities</text>
  <rect x="180" y="480" width="250" height="82" rx="10" class="act"/><text x="219" y="511" class="head">Recycling LCI analysis</text><text x="210" y="536" class="small">outputs compiled inventory document</text>
  <rect x="540" y="480" width="280" height="82" rx="10" class="act"/><text x="575" y="511" class="head">Recycling CF computation</text><text x="580" y="536" class="small">PMDco computing process; black-box</text>
  <rect x="830" y="480" width="195" height="82" rx="10" class="act"/><text x="871" y="505" class="head">Supplier CF</text><text x="868" y="526" class="head">computation</text><text x="847" y="548" class="small">source + spec inputs</text>
  <rect x="1035" y="480" width="280" height="82" rx="10" class="act"/><text x="1085" y="511" class="head">Bottle CF computation</text><text x="1078" y="536" class="small">evidence + specification inputs</text>
  <path d="M150 392L250 480M415 392L360 480M430 521H540M680 392V480M947 392L760 480M1235 392V480" class="edge"/>

  <text x="45" y="625" class="head">Result layer</text>
  <rect x="65" y="650" width="270" height="92" rx="10" class="res"/><text x="94" y="678" class="head">6 subprocess CF results</text><text x="90" y="701" class="small">about process + climate change + GWP100</text><text x="111" y="721" class="small">each has a scalar value</text>
  <rect x="450" y="650" width="255" height="92" rx="10" class="res"/><text x="486" y="678" class="head">Recovered-pellet CF</text><text x="490" y="701" class="small">49.0 kg CO2e / 300 kg batch</text><text x="480" y="721" class="small">gate-to-gate declared boundary</text>
  <rect x="820" y="650" width="220" height="92" rx="10" class="res"/><text x="845" y="678" class="head">Supplier CF result</text><text x="850" y="701" class="small">1260.0 kg CO2e / 700 kg</text><text x="850" y="721" class="small">supplier-declared boundary</text>
  <rect x="1110" y="650" width="265" height="92" rx="10" class="res"/><text x="1146" y="678" class="head">Final bottle CF result</text><text x="1149" y="701" class="small">1400.0 kg CO2e / 1000 kg</text><text x="1145" y="721" class="small">mixing + blow molding included</text>
  <path d="M620 562L250 650M680 562L575 650M927 562V650M1175 562L1240 650M335 696H450M705 696V755H1080V696H1110M1040 696H1110" class="edge"/>
  <rect x="390" y="770" width="660" height="32" rx="8" class="warn"/><text x="427" y="792" class="small">contributes-to does not assert summation, exhaustive coverage, allocation, transitivity, or comparability</text>
</svg>
