<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="975" viewBox="0 0 1400 975" role="img" aria-labelledby="title desc">
<title id="title">P1 recycling provenance: one housing-recycling process and its RDF relationships</title>
<desc id="desc">A single housing recycling individual has two material inputs, one recovered ingot output, two occurrent subprocesses and one operator. Remelting produces melt, which is casting input. A recycling record is about four modelled entities. All relationships shown are in the accepted RDF data.</desc>
