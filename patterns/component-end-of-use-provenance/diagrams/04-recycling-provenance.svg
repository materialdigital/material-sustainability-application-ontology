.nodeTitle{font-size:22px;font-weight:700}.nodeInfo{font-size:17px;fill:#40566A}.tiny{font-size:16px;fill:#40566A}
.edge{font-size:17px;font-weight:600;fill:#354A60}.panel{fill:#FCFDFE;stroke:#D9E1E8;stroke-width:1.7}
.path{stroke:#354A60;stroke-width:2.5;fill:none;marker-end:url(#arr)}
</style>
